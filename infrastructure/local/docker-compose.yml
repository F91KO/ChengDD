services:
  mysql:
    image: mysql:5.7.44
    container_name: cdd-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${CDD_LOCAL_MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${CDD_LOCAL_MYSQL_DATABASE:-chengdd}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${CDD_LOCAL_MYSQL_PORT:-3306}:3306"
    volumes:
      - cdd-local-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: cdd-local-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_CONSOLE_ENABLE: ${NACOS_AUTH_CONSOLE_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${CDD_LOCAL_NACOS_AUTH_TOKEN:-Y2hlbmdkZGxvY2FsbmFjb3NhdXRoLXRva2VuLTIwMjY=}
      NACOS_AUTH_IDENTITY_KEY: ${CDD_LOCAL_NACOS_IDENTITY_KEY:-chengdd-local-key}
      NACOS_AUTH_IDENTITY_VALUE: ${CDD_LOCAL_NACOS_IDENTITY_VALUE:-chengdd-local-value}
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "${CDD_LOCAL_NACOS_CONSOLE_PORT:-8080}:8080"
      - "${CDD_LOCAL_NACOS_PORT:-8848}:8848"
      - "${CDD_LOCAL_NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - cdd-local-nacos-data:/home/nacos/data
      - cdd-local-nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/v3/console/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 18

  redis:
    image: redis:7.2.5-alpine
    container_name: cdd-local-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${CDD_LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - cdd-local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  cdd-local-mysql-data:
  cdd-local-nacos-data:
  cdd-local-nacos-logs:
  cdd-local-redis-data:
